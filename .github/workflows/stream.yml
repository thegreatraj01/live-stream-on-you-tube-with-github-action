name: Scheduled YouTube Live Stream

on:
  repository_dispatch:
    types:
      - noon-ist
      - noon-new-york
  workflow_dispatch:
    inputs:
      video_file:
        description: Video file to stream
        required: false
        type: choice
        options:
          - video.mp4
          - video2.mp4
        default: video.mp4

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-24.04
    env:
      VIDEO_FILE: ${{ github.event_name == 'workflow_dispatch' && (inputs.video_file || github.event.inputs.video_file || 'video.mp4') || github.event.action == 'noon-new-york' && 'video2.mp4' || 'video.mp4' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Debug trigger details
        run: |
          echo "Trigger event: $GITHUB_EVENT_NAME"
          echo "inputs.video_file: ${{ inputs.video_file }}"
          echo "github.event.inputs.video_file: ${{ github.event.inputs.video_file }}"
          echo "github.event.action: ${{ github.event.action }}"
          echo "Resolved VIDEO_FILE: $VIDEO_FILE"

      - name: Download video from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download daily-stream \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$VIDEO_FILE" \
            --dir release-assets

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Start Live Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: node scripts/stream.js