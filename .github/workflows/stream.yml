name: Scheduled YouTube Live Stream

on:
  repository_dispatch:
    types:
      - noon-ist
      - noon-new-york
  workflow_dispatch:
    inputs:
      video_file:
        description: Video file to stream
        required: true
        type: choice
        options:
          - video.mp4
          - video2.mp4
        default: video.mp4

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-24.04
    env:
      VIDEO_FILE: ${{ github.event.action == 'noon-new-york' && 'video2.mp4' || github.event.inputs.video_file || 'video.mp4' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Show trigger details
        run: |
          echo "Trigger event: $GITHUB_EVENT_NAME"
          echo "Runner time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Video file: $VIDEO_FILE"

      - name: Start Live Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: node scripts/stream.js
