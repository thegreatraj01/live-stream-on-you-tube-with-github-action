name: Daily YouTube Stream

on:
  schedule:
    # GitHub Actions schedules use UTC. 16:15 UTC is 21:45 India time (IST).
    - cron: "35 16 * * *"
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show trigger details
        run: |
          echo "Trigger event: $GITHUB_EVENT_NAME"
          echo "Runner time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Configured schedule: 16:15 UTC (21:45 IST)"

      - name: Start Live Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: node scripts/stream.js
