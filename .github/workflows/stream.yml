name: Daily YouTube Stream

on:
  schedule:
    # Daily schedule in UTC
    # 00:00 UTC = 05:30 IST / 19:00 NY (previous day winter)
    # 06:00 UTC = 11:30 IST / 01:00 NY
    # 12:00 UTC = 17:30 IST / 07:00 NY
    # 14:00 UTC = 19:30 IST / 09:00 NY
    # 18:00 UTC = 23:30 IST / 13:00 NY
    # 21:00 UTC = 02:30 IST next day / 16:00 NY
    # Example: run every day at 14:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start Live Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: node scripts/stream.js
