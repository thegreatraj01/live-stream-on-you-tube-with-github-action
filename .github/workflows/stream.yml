name: Daily YouTube Stream

on:
  schedule:
    # Set your daily trigger time in UTC (e.g., 14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start Live Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: node scripts/stream.js
