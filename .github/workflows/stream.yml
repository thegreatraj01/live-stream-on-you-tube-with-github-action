name: Scheduled YouTube Live Stream

on:
  repository_dispatch:
    types:
      - noon-ist
      - noon-new-york
  workflow_dispatch:
    inputs:
      video_file:
        description: Video file to stream
        required: false
        type: choice
        options:
          - video.mp4
          - video2.mp4
        default: video.mp4
      loop_count:
        description: Total number of times to play the video
        required: false
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        default: "1"

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve stream parameters
        shell: bash
        env:
          INPUT_VIDEO_FILE: ${{ github.event.inputs.video_file || inputs.video_file || 'video.mp4' }}
          INPUT_LOOP_COUNT: ${{ github.event.inputs.loop_count || inputs.loop_count || '1' }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VIDEO_FILE="${INPUT_VIDEO_FILE}"
            LOOP_COUNT="${INPUT_LOOP_COUNT}"
          elif [ "${{ github.event.action }}" = "noon-new-york" ]; then
            VIDEO_FILE="video2.mp4"
            LOOP_COUNT="4"
          else
            VIDEO_FILE="video.mp4"
            LOOP_COUNT="4"
          fi

          if [ -z "$VIDEO_FILE" ]; then
            VIDEO_FILE="video.mp4"
          fi

          case "$VIDEO_FILE" in
            video.mp4|video2.mp4)
              ;;
            *)
              echo "Unsupported video file: $VIDEO_FILE"
              exit 1
              ;;
          esac

          if ! [[ "$LOOP_COUNT" =~ ^[1-6]$ ]]; then
            echo "Unsupported loop count: $LOOP_COUNT"
            exit 1
          fi

          echo "Resolved VIDEO_FILE=$VIDEO_FILE"
          echo "Resolved LOOP_COUNT=$LOOP_COUNT"
          echo "VIDEO_FILE=$VIDEO_FILE" >> "$GITHUB_ENV"
          echo "LOOP_COUNT=$LOOP_COUNT" >> "$GITHUB_ENV"

      - name: Debug release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view daily-stream --repo "$GITHUB_REPOSITORY" --json assets

      - name: Download video from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          echo "Downloading asset: $VIDEO_FILE"
          gh release download daily-stream \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$VIDEO_FILE" \
            --dir release-assets
          ls -lh release-assets
          test -f "release-assets/$VIDEO_FILE"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate downloaded video
        run: |
          set -euo pipefail
          ffprobe -v error -show_streams -show_format "release-assets/$VIDEO_FILE"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Start Live Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          VIDEO_FILE: ${{ env.VIDEO_FILE }}
          LOOP_COUNT: ${{ env.LOOP_COUNT }}
        run: node scripts/stream.js